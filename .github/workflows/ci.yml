name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code style
        run: ./gradlew ktlintCheck

      - name: Run static analysis
        run: ./gradlew detekt

      - name: Build core and compose
        run: ./gradlew :formidable-core:build :formidable-ksp:build :formidable-compose:build -x lint

      - name: Run tests with coverage
        run: ./gradlew test koverXmlReport

      - name: Build Android sample
        run: ./gradlew :composeApp:assembleDebug -x lint

      - name: Build WASM showcase
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Upload WASM artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-showcase
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 1

  pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-showcase
          path: wasm-dist/

      - name: Assemble site
        run: |
          mkdir -p dist/demo
          cp -r docs/. dist/
          cp -r wasm-dist/. dist/demo/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4