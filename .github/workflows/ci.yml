name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code style
        run: ./gradlew ktlintCheck

      - name: Run static analysis
        run: ./gradlew detekt

      - name: Build core modules
        run: ./gradlew :formidable-core:build :formidable-ksp:build :formidable-compose:build -x lint -x lintAnalyzeDebug -x lintAnalyzeDebugAndroidTest

      - name: Run tests with coverage
        run: ./gradlew test koverXmlReport

      - name: Build sample app
        run: ./gradlew :formidable-sample-android:assembleDebug -x lint
