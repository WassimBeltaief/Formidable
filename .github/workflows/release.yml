name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  publish-android-ksp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Android and KSP artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache \
            :formidable-core:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :formidable-core:publishJvmPublicationToLocalStagingRepository \
            :formidable-core:publishWasmJsPublicationToLocalStagingRepository \
            :formidable-compose:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :formidable-compose:publishAndroidReleasePublicationToLocalStagingRepository \
            :formidable-compose:publishWasmJsPublicationToLocalStagingRepository \
            :formidable-ksp:publishMavenPublicationToLocalStagingRepository

      - name: Upload staging
        uses: actions/upload-artifact@v4
        with:
          name: staging-ubuntu
          path: build/staging/

  publish-ios-jvm:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish JVM, iOS, and metadata artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache \
            :formidable-core:publishIosArm64PublicationToLocalStagingRepository \
            :formidable-core:publishIosX64PublicationToLocalStagingRepository \
            :formidable-core:publishIosSimulatorArm64PublicationToLocalStagingRepository \
            :formidable-compose:publishIosArm64PublicationToLocalStagingRepository \
            :formidable-compose:publishIosX64PublicationToLocalStagingRepository \
            :formidable-compose:publishIosSimulatorArm64PublicationToLocalStagingRepository

      - name: Upload staging
        uses: actions/upload-artifact@v4
        with:
          name: staging-macos
          path: build/staging/

  bundle-and-release:
    needs: [publish-android-ksp, publish-ios-jvm]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Merge staging artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          pattern: staging-*
          path: staging/

      - name: List staging contents
        run: find staging/ -type f | sort

      - name: Bundle and upload to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          cd staging
          zip -r ../bundle.zip .
          cd ..
          curl --fail --request POST \
            --header "Authorization: Bearer $(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)" \
            --form "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=formidable-${{ steps.version.outputs.VERSION }}&publishingType=AUTOMATIC"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
