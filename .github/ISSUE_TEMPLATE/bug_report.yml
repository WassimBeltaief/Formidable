name: Bug Report
description: Something isn't working as expected
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check if there's already an open issue for this.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Minimal code that reproduces the issue.
      render: kotlin
      placeholder: |
        @FormSchema
        data class MyForm(
            @Field(label = "Name")
            val name: String = ""
        )
        // ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Formidable version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: kotlin-version
    attributes:
      label: Kotlin version
      placeholder: "1.9.22"
    validations:
      required: true

  - type: input
    id: agp-version
    attributes:
      label: Android Gradle Plugin version
      placeholder: "8.7.3"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Stack traces, related issues, attempted workarounds.
    validations:
      required: false
