<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formidable — Live Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #09090b;
      border-bottom: 1px solid #27272a;
    }
    header a {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }
    header a:hover { color: #fff; }
    header span {
      color: #71717a;
      font-size: 13px;
      text-align: center;
      flex: 1;
      padding: 0 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #ComposeTarget {
      flex: 1;
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <a href="../">← Formidable</a>
    <span>Sign-up form · Compose Multiplatform WASM</span>
    <a href="https://github.com/WassimBeltaief/Formidable" target="_blank" rel="noopener">GitHub ↗</a>
  </header>
  <canvas id="ComposeTarget"></canvas>
  <script src="composeApp.js"></script>
</body>
</html>
